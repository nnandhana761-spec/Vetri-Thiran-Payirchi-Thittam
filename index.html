<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ComicCraft — Create a comic</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="shell hero"><header><div class="brand">✦ ComicCraft</div><span class="tag">YOUR IDEA, PANEL BY PANEL</span></header><section class="intro"><p class="eyebrow">AI-POWERED STORY STUDIO</p><h1>Make your own <em>comic universe.</em></h1><p>Turn a spark of imagination into a five-panel adventure.</p></section>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form action="/generate" method="post" class="form"><label>Story idea<textarea name="prompt" required minlength="5" maxlength="2000" placeholder="A brave fox discovers a doorway to a forgotten moon..." rows="3">{{ prompt or '' }}</textarea></label><div class="fields"><label>Main character<input name="character_name" value="Mira" maxlength="80" required></label><label>Setting<select name="setting">{% for v in ['enchanted forest','school','space','city','underwater kingdom'] %}<option>{{v}}</option>{% endfor %}</select></label><label>Story tone<select name="tone">{% for v in ['adventurous','funny','dramatic','poetic','light-hearted'] %}<option>{{v}}</option>{% endfor %}</select></label><label>Art style<select name="art_style">{% for v in ['comic book','anime','pixel art','realistic'] %}<option>{{v}}</option>{% endfor %}</select></label></div><button class="primary" type="submit">Create my comic <span>→</span></button><p class="hint">Creates 5 panels. First run may take a little while when AI services are enabled.</p></form></main></body></html>
